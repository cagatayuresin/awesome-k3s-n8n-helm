apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "n8n.fullname" . }}-postgres
  namespace: {{ include "n8n.namespace" . }}
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "n8n.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "n8n.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "n8n.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: {{ .Values.securityContext.postgres.fsGroup }}
      {{- if .Values.persistence.postgres.enabled }}
      initContainers:
        # Fix volume ownership for K3s local-path provisioner before PostgreSQL initializes
        - name: init-chmod-data
          image: "{{ .Values.postgres.initImage.repository }}:{{ .Values.postgres.initImage.tag }}"
          imagePullPolicy: {{ .Values.postgres.initImage.pullPolicy }}
          command:
            - sh
            - -c
            - |
              chown -R 999:999 /var/lib/postgresql
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
      {{- end }}
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "n8n.fullname" . }}
                  key: postgres-password
            {{- if .Values.postgres.extraEnv }}
            {{- toYaml .Values.postgres.extraEnv | nindent 12 }}
            {{- end }}
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          {{- if .Values.healthChecks.postgres.enabled }}
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgres.user | quote }}
                - -d
                - {{ .Values.postgres.database | quote }}
            initialDelaySeconds: {{ .Values.healthChecks.postgres.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthChecks.postgres.periodSeconds }}
            timeoutSeconds: {{ .Values.healthChecks.postgres.timeoutSeconds }}
            failureThreshold: {{ .Values.healthChecks.postgres.failureThreshold }}
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgres.user | quote }}
                - -d
                - {{ .Values.postgres.database | quote }}
            initialDelaySeconds: {{ .Values.healthChecks.postgres.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthChecks.postgres.periodSeconds }}
            timeoutSeconds: {{ .Values.healthChecks.postgres.timeoutSeconds }}
            failureThreshold: {{ .Values.healthChecks.postgres.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          {{- if .Values.persistence.postgres.enabled }}
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
          {{- end }}
      {{- if .Values.persistence.postgres.enabled }}
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: {{ include "n8n.fullname" . }}-postgres
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

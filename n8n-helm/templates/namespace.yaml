{{- $ns := include "n8n.namespace" . -}}
{{- if and .Values.createNamespace (not (has $ns (list "default" "kube-system" "kube-public" "kube-node-lease"))) }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
{{- end }}

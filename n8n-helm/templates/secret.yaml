apiVersion: v1
kind: Secret
metadata:
  name: {{ include "n8n.fullname" . }}
  namespace: {{ include "n8n.namespace" . }}
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
type: Opaque
data:
  postgres-password: {{ .Values.postgres.password | b64enc | quote }}
  {{- if .Values.n8n.encryptionKey }}
  n8n-encryption-key: {{ .Values.n8n.encryptionKey | b64enc | quote }}
  {{- end }}
